# Lo manda robert-flo/pj-template (plantillas/hijo/pj-template.yml); no lo edités en el hijo.
# - pull_request / push: `./pj check` (trae pj-template al SHA de template_ref y verifica todo).
# - schedule / dispatch / repository_dispatch: pj-sync sube template_ref al último main de
#   pj-template por PR (el PR corre el check de arriba).
# Secreto: PJ_TEMPLATE_TOKEN (ver docs/pj-template.md en pj-template).
name: pj-template
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [pj-template-updated]
  schedule:
    - cron: "17 10 * * *"   # 04:17 en El Salvador
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./pj check
        env:
          PJ_TEMPLATE_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
  sync:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    uses: robert-flo/pj-template/.github/workflows/pj-sync.yml@main
    secrets:
      PJ_TEMPLATE_TOKEN: ${{ secrets.PJ_TEMPLATE_TOKEN }}
